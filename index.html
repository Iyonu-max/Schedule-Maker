<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">

    <!-- GREETING -->
    <section class="card greeting-card">
      <div class="greeting-left">
        <h1 id="greeting-text">Good morning!</h1>
        <p id="datetime-text"></p>
      </div>
      <div class="greeting-right">
        <button class="btn-icon" id="name-edit-btn" title="Set your name">✏️</button>
      </div>
    </section>

    <!-- NAME MODAL -->
    <div id="name-modal" class="modal hidden">
      <div class="modal-box">
        <h3>What's your name?</h3>
        <input id="name-input" type="text" placeholder="Enter your name" maxlength="30" />
        <div class="modal-actions">
          <button class="btn-secondary" id="name-cancel">Cancel</button>
          <button class="btn-primary" id="name-save">Save</button>
        </div>
      </div>
    </div>

    <div class="main-grid">

      <!-- FOCUS TIMER -->
      <section class="card timer-card">
        <h2>Focus Timer</h2>
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-controls">
          <button class="btn-primary" id="timer-start">Start</button>
          <button class="btn-secondary" id="timer-stop">Stop</button>
          <button class="btn-ghost" id="timer-reset">Reset</button>
        </div>
        <div class="timer-setting">
          <label for="pomodoro-minutes">Duration (min)</label>
          <input id="pomodoro-minutes" type="number" min="1" max="99" value="25" />
          <button class="btn-ghost btn-sm" id="pomodoro-apply">Apply</button>
        </div>
      </section>

      <!-- TO-DO LIST -->
      <section class="card todo-card">
        <div class="todo-header">
          <h2>To-Do</h2>
          <select id="sort-select">
            <option value="added">Order added</option>
            <option value="alpha">A → Z</option>
            <option value="done">Done last</option>
          </select>
        </div>
        <div class="todo-input-row">
          <input id="todo-input" type="text" placeholder="New task…" maxlength="120" />
          <button class="btn-primary" id="todo-add">Add</button>
        </div>
        <ul id="todo-list"></ul>
      </section>

    </div>

    <!-- QUICK LINKS -->
    <section class="card links-card">
      <div class="links-header">
        <h2>Quick Links</h2>
        <button class="btn-ghost btn-sm" id="link-add-btn">+ Add</button>
      </div>
      <div id="links-grid"></div>

      <div id="link-form" class="link-form hidden">
        <input id="link-name" type="text" placeholder="Label" maxlength="24" />
        <input id="link-url" type="url" placeholder="https://…" />
        <button class="btn-primary btn-sm" id="link-save">Save</button>
        <button class="btn-ghost btn-sm" id="link-cancel">Cancel</button>
      </div>
    </section>

  </div>

  <!-- THEME TOGGLE -->
  <button class="theme-toggle" id="theme-toggle" title="Toggle theme">🌙</button>

  <script src="js/app.js"></script>
</body>
</html>
